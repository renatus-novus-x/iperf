name: windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    # Pinned to the windows-2022 image: windows-latest now ships Visual
    # Studio 2026 only, so the "Visual Studio 17" generator is not
    # found there.
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3

    - name: cmake build
      run: |
        mkdir build
        cd  build
        cmake ../ -G "Visual Studio 17" -A x64
        cmake --build . --target ALL_BUILD --config Release
        cmake --build . --target ALL_BUILD --config Debug

